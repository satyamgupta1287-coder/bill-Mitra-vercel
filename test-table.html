<!doctype html>
<html>
<head>
<style>
table { border-collapse: collapse; width: 100%; height: 500px; border: 1px solid black; }
th { border: 1px solid black; }
td { border: 1px solid black; border-top: none; border-bottom: none; }
.item-row td { border-bottom: 1px solid #ccc; height: 30px; }
</style>
</head>
<body>
<table>
  <thead><tr><th>A</th><th>B</th></tr></thead>
  <tbody>
    <tr class="item-row"><td>1</td><td>2</td></tr>
    <tr class="item-row"><td>3</td><td>4</td></tr>
    <tr><td></td><td></td></tr> <!-- filler row to stretch -->
  </tbody>
</table>
</body>
</html>
